[package]
name = "workflow-console-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local-only experiment for a workflow console built with Topcoat."
license = "MIT"
publish = false

[workspace]
members = [".", "crates/graph-flow-jcode"]
resolver = "3"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
chrono = "0.4.42"
croner = "3.0.1"
futures-core = "0.3"
garde = { version = "0.23", features = ["derive"] }
graph-flow = "0.6.0"
graph-flow-jcode = { path = "crates/graph-flow-jcode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.51.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
topcoat = { version = "0.5.0", features = ["datastar", "tailwind"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
xdg = "3"

[build-dependencies]
topcoat = { version = "0.5.0", default-features = false, features = ["tailwind"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
fn_to_numeric_cast_any = "deny"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
use_debug = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
mod_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enums = "warn"
# Public domain types are intentionally exhaustive so new cases break unchecked consumers.
exhaustive_enums = "allow"
exhaustive_structs = "allow"
multiple_crate_versions = "allow"
