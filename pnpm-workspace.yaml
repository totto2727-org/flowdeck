packages:
  - .

# Official Vite+ bundled toolchain: https://viteplus.dev/guide/migrate
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# TODO: Remove these release-age exceptions after 2026-11-09T04:34:00Z.
minimumReleaseAgeExclude:
  - '@totto2727/reylo@0.7.0'
  - '@totto2727/reylo-sqlite@0.7.0'
  # TODO: Remove these Effront exceptions after 2026-11-09T16:30:51.871Z.
  - '@effront/alchemy@0.4.0'
  - '@effront/core@0.4.0'
  - '@effront/tailwind@0.4.0'
  - '@effront/vite@0.4.0'

# Only the native build tools required by Cloudflare's local runtime are trusted.
allowBuilds:
  '@google/genai': false
  protobufjs: false
  esbuild: true
  workerd: true
  core-js-pure: false
  '@mongodb-js/zstd': false
  node-liblzma: false

patchedDependencies:
  # TODO: Remove after consuming the fixed Effront release from https://github.com/totto2727-org/effront/pull/33.
  '@effront/alchemy@0.4.0': patches/@effront__alchemy@0.4.0.patch
  alchemy@2.0.0-beta.83: patches/alchemy@2.0.0-beta.83.patch
