[package]
name = "workflow-resources"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Execution-scoped live resource storage for Flowdeck workflows"
license = "MIT"
publish = false

[dependencies]
thiserror = "2"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
graph-flow.workspace = true
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
