name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@b4e0bc6b04d2ac0d9a9b89a2a308228eee6a4255 # official setup-vp
      - name: Verify Vite+ project
        run: vp run ci
