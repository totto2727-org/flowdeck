name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - uses: ariga/setup-atlas@v0
      - name: Verify Vite+ project
        run: vp run ci
  check-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Verify retained Rust workspace
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          just ci
